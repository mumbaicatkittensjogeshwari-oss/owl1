name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      working-directory: ./frontend
      run: flutter pub get

    - name: Generate native platform folders
      working-directory: ./frontend
      run: flutter create . --platforms=android

    - name: Allow cleartext HTTP traffic (localhost backend)
      working-directory: ./frontend
      run: |
        sed -i 's#<application#<application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
        grep usesCleartextTraffic android/app/src/main/AndroidManifest.xml

    # Analyze aur Test hata diya hai taaki build direct chale
    - name: Build APK
      working-directory: ./frontend
      run: flutter build apk --release

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: frontend/build/app/outputs/flutter-apk/app-release.apk
