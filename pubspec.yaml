name: trading_bot
description: Modern Trading Bot with real-time data
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Networking
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Charts & UI
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  intl: ^0.18.1
  
  # Utilities
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.0
  
  # Modern UI Components
  glassmorphism: ^3.0.0
  animated_bottom_navigation_bar: ^1.2.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700